name: Release

# Tag-triggered release build: cross-compiles the `skillmaker` binary for
# every supported platform on a single linux runner (bun's
# `build --compile --target=...` handles the cross-compilation -- no
# per-platform runner matrix needed) and publishes a GitHub Release with an
# archive per platform (plan.md Phase 18 "installer experience").
#
# Scope for this pass: the CLI binary + viewer-dist/ + VERSION per platform,
# archived as `skillmaker-<version>-<os>-<arch>.tar.gz` (`.zip` for
# win32-x64). The Skillmaker.app bundle (macOS, code-signed + notarized) is
# explicitly OUT of scope here -- signing/notarization is a separate
# follow-up (plan.md Phase 18 scope item (a) mentions the .app bundle as a
# later addition, not this pass).
#
# Platforms: darwin-arm64, darwin-x64 (Intel), linux-x64, win32-x64 -- the
# four keys of scripts/build-dist.sh's --all mode.
#
# Also publishes the npm zero-install door (install-simplification.md Phase
# A.4): the build job assembles all four `@skillmaker/cli-<platform>-<arch>`
# packages plus the skillmaker-studio wrapper
# (scripts/build-npm-packages.sh --all), and publish-npm publishes them --
# via trusted publishing (OIDC) -- no NPM_TOKEN secret involved.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install
        run: bun install --frozen-lockfile
        env:
          # prepare script clones effect source for local research; skip in CI
          SKIP_EFFECT_CLONE: "1"
      - name: Build dist artifacts for all platforms (bun cross-compile)
        run: ./scripts/build-dist.sh --all
      - name: Package release archives (one per platform)
        run: |
          set -eu
          version="$(cat dist/VERSION)"
          # Archive the three artifacts at the archive's top level (not
          # nested in a wrapper directory) -- install.sh extracts and looks
          # for ./skillmaker and ./viewer-dist directly. Windows gets a
          # .zip (the native archive format there); its binary is
          # skillmaker.exe.
          for key in darwin-arm64 darwin-x64 linux-x64; do
            tar -czf "skillmaker-${version}-${key}.tar.gz" \
              -C "dist/targets/${key}" skillmaker viewer-dist VERSION
          done
          (cd dist/targets/win32-x64 &&
            zip -qr "${GITHUB_WORKSPACE}/skillmaker-${version}-win32-x64.zip" \
              skillmaker.exe viewer-dist VERSION)
          ls -l skillmaker-"${version}"-*
      - uses: actions/upload-artifact@v4
        with:
          name: skillmaker-release-archives
          path: |
            skillmaker-*.tar.gz
            skillmaker-*.zip
      - name: Build npm packages (all platform packages + wrapper, Phase A.2/A.3)
        # Tag is "vX.Y.Z" -- npm packages publish under the bare version
        # (no leading "v"), same version the GitHub Release above carries.
        run: ./scripts/build-npm-packages.sh --all "${GITHUB_REF_NAME#v}"
      - name: Tar npm packages (preserves the executable bit through upload-artifact's zip hop)
        run: tar -czf npm-packages.tar.gz -C dist/npm .
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages.tar.gz

  publish-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skillmaker-release-archives
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true

  # Publishes the zero-install npm door (Phase A.4): the four platform
  # packages built above plus the skillmaker-studio wrapper that resolves
  # between them.
  publish-npm:
    needs: [build]
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm authenticates via a per-run token minted
    # against this repo+workflow's registered trusted publisher -- no
    # NPM_TOKEN secret, no 2FA prompt, provenance attached. (GATs lose
    # direct publish ~Jan 2027 per the 2026-07-08 npm changelog.)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: artifacts
      - name: Extract npm packages (restores the executable bit tar preserved)
        run: |
          set -eu
          mkdir -p pkgs
          tar -xzf artifacts/npm-packages.tar.gz -C pkgs
          ls -l pkgs/*/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (OIDC needs npm >= 11.5)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Publish established platform packages + wrapper
        run: |
          set -eu
          # cd into each package rather than passing the path: a bare
          # "pkgs/name" argument matches npm's GitHub owner/repo shorthand
          # and gets resolved as a git spec, not a directory (v0.3.0's
          # publish failed exactly this way).
          for dir in pkgs/cli-darwin-arm64 pkgs/cli-linux-x64 pkgs/skillmaker-studio; do
            echo "==> npm publish ${dir}"
            (cd "${dir}" && npm publish --access public)
          done
      # NEW packages (first shipped with the win32/darwin-x64 work): kept in
      # their own step so a failure here is unambiguous and does NOT block
      # the established packages above (they publish first).
      #
      # ONE-TIME SETUP REQUIRED before this step can succeed: each package
      # below needs a trusted publisher registered on npmjs.com (until then,
      # `npm publish` fails 404/403 on the PUT). Register, under the
      # @skillmaker org, for EACH of:
      #
      #   package @skillmaker/cli-win32-x64
      #     -> GitHub repo: sociotechnica-org/skillmaker-studio
      #     -> workflow file: release.yml
      #     -> environment: (none)
      #   package @skillmaker/cli-darwin-x64
      #     -> GitHub repo: sociotechnica-org/skillmaker-studio
      #     -> workflow file: release.yml
      #     -> environment: (none)
      #
      # npmjs.com > package (after first manual claim) or org > Publishing
      # access > "Trusted publisher" > GitHub Actions. Note: npm requires
      # the package to exist before a trusted publisher can be attached; if
      # registration isn't possible pre-publish, do the first publish of
      # each from a maintainer machine (`npm publish --access public` inside
      # the run's npm-packages artifact dirs), then register, and later tags
      # publish via OIDC like the other three.
      - name: Publish NEW platform packages (win32-x64, darwin-x64 -- needs one-time trusted-publisher registration, see comment above)
        run: |
          set -eu
          for dir in pkgs/cli-darwin-x64 pkgs/cli-win32-x64; do
            echo "==> npm publish ${dir}"
            (cd "${dir}" && npm publish --access public)
          done
