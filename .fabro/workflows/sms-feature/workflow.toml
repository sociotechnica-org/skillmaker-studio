# sms-feature: implement a Skillmaker Studio feature end to end.
#
# Adapted from alexandria-internal's ax-feature workflow. Backend copied
# from there (api backend, OpenAI). Models per director rulings (PR
# #188, 2026-08-11): gpt-5.6-terra medium is the run default (handoff);
# implement overrides to gpt-5.6-sol medium (post-#208-autopsy trial);
# scope and the combined ReviewJudge override to gpt-5.6-sol high in
# workflow.fabro -- think hard at the gates, run lean in the loop.
# Graph reshaped 2026-08-04 after the first batch cycled expensively:
# one review-judge stage instead of review + verify + verification
# judge, with per-node max_visits loop caps (see workflow.fabro).

_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Implement a Skillmaker Studio feature."

[run.inputs]
agent_backend = "api"

[run.model]
provider = "openai"
name = "gpt-5.6-terra"

[run.model.controls]
reasoning_effort = "medium"

[[run.prepare.steps]]
command = ["./.fabro/scripts/fabro-setup-env"]

# The fabro-of-alexandria GitHub App (made public 2026-08, installed
# org-wide on sociotechnica-org) is the bot identity for this factory;
# same numeric id alexandria's config uses. See .fabro/README.md.
[run.git.author]
name = "Fabro"
email = "285810526+fabro-of-alexandria[bot]@users.noreply.github.com"

# The server mints a scoped installation token with these permissions and
# injects it as GITHUB_TOKEN in the sandbox. Requires the GitHub App
# install (director-only step, documented in .fabro/README.md).
[run.integrations.github.permissions]
contents = "write"
pull_requests = "write"

[run.pull_request]
enabled = true
draft = true

# Run evidence (screenshots, test results, any ad-hoc verification
# notes) is uploaded as run artifacts, never checkpointed into the
# branch (it would otherwise land in the PR diff). Kept after the
# 2026-08-04 graph reshape even though the dedicated verify stage is
# gone -- stages may still drop evidence in these paths.
[run.checkpoint]
exclude_globs = [
  "verification-artifacts/**",
  "screenshots/**",
  "test-results/**",
]

[run.artifacts]
include = [
  "verification-artifacts/**",
  "screenshots/**",
  "test-results/**",
]

[run.environment]
id = "daytona"

[environments]

[environments.daytona]
provider = "daytona"

[environments.daytona.lifecycle]
preserve = false
auto_stop = "60m"

[environments.daytona.labels]
project = "skillmaker-studio"
workflow = "sms-feature"
host = "railway"
